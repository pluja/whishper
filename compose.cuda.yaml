# NVIDIA overlay. Enable it for every command with this line in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.cuda.yaml
#
# GPU reservations are structural and cannot be toggled by an environment
# variable, which is why they live in an overlay rather than in compose.yaml.
# The image gets its own name so a CPU build never replaces the CUDA one.
#
# Requires the NVIDIA Container Toolkit on the host.

services:
  worker:
    image: anysub-worker-cuda
    build:
      args:
        ANYSUB_ACCELERATOR: cuda
    environment:
      ANYSUB_DEVICE: cuda
      ANYSUB_COMPUTE_TYPE: ${ANYSUB_COMPUTE_TYPE:-float16}
      ANYSUB_WORKER_NAME: ${ANYSUB_WORKER_NAME:-local-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
