# NVIDIA overlay. Enable it for every command with this line in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.cuda.yaml
#
# GPU reservations are structural and cannot be toggled by an environment
# variable, which is why they live in an overlay rather than in compose.yaml.
# Keep the image tag equal to the worker tag in compose.yaml.
#
# Requires the NVIDIA Container Toolkit on the host. See
# https://github.com/pluja/anysub/blob/main/docs/GPU.md

services:
  worker:
    image: ghcr.io/pluja/anysub-worker:4.0.3-cuda
    environment:
      # The CUDA image already defaults to this. Stating it makes a CPU image
      # behind this overlay fail at startup instead of ignoring the GPU.
      ANYSUB_DEVICE: cuda
      ANYSUB_WORKER_NAME: ${ANYSUB_WORKER_NAME:-local-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
