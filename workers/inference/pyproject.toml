[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anysub-worker"
version = "4.0.3"
description = "Model-agnostic processing worker for Anysub"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
]

[project.scripts]
anysub-worker = "anysub_worker.cli:main"
anysub-adapters = "anysub_worker.cli:list_adapters"
anysub-protocol-schema = "anysub_worker.cli:export_protocol_schema"

[project.entry-points."anysub.adapters"]
whisperx = "anysub_worker.adapters.whisperx.adapter:WhisperXAdapter"

[project.optional-dependencies]
speech = [
  "whisperx==3.8.6",
]
cpu = [
  "torch>=2.8,<2.9",
  "torchaudio>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
]
cuda = [
  "torch>=2.8,<2.9",
  "torchaudio>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
  "pyright[nodejs]>=1.1.400,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "respx>=0.22.0,<0.23",
  "ruff>=0.12.7,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anysub_worker"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
