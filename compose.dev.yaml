# The project name keeps development containers, networks and volumes apart
# from the production stack in compose.yaml, even when -p is forgotten.
name: anysub-dev

# Its own port lets development run next to production. Sign-in and uploads
# only accept requests from BETTER_AUTH_URL, so it follows the port.
x-dev-url: &dev-url http://localhost:${ANYSUB_DEV_PORT:-5174}

services:
  migrate:
    image: anysub-web-dev
    build:
      target: development
    # The source bind mount hides every node_modules directory baked into the
    # image, so each workspace package keeps its own in a named volume.
    volumes: &web-volumes
      - .:/workspace:z
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-contracts-node-modules:/workspace/packages/contracts/node_modules
    # Named node_modules volumes are only seeded from the image once. CI makes
    # pnpm reinstall them non-interactively when the lockfile moves on.
    environment: &pnpm-non-interactive
      CI: "true"
    working_dir: /workspace/apps/web
    command: ["pnpm", "migrate"]

  web:
    image: anysub-web-dev
    build:
      target: development
    volumes: *web-volumes
    environment:
      <<: *pnpm-non-interactive
      BETTER_AUTH_URL: *dev-url
      ORIGIN: *dev-url
    working_dir: /workspace
    command: ["pnpm", "--filter", "@anysub/web", "dev", "--host", "0.0.0.0"]
    ports: !override
      - "${ANYSUB_DEV_PORT:-5174}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "apps/web/scripts/healthcheck.mjs",
          "http://localhost:5173/api/health",
        ]

  worker:
    image: anysub-worker-dev
    build:
      target: development
    volumes:
      - ./workers/inference:/workspace:z
      - worker-venv:/workspace/.venv
      # Mirrors the repository layout, where ../../packages/contracts is
      # reachable from the worker root, so the protocol schema export and its
      # drift test work in the container too.
      - ./packages/contracts/schema:/packages/contracts/schema:z
      - app-data:/data:ro
      - model-cache:/models
    working_dir: /workspace
    environment:
      ANYSUB_APP_URL: http://web:5173
    command:
      ["uv", "run", "--extra", "speech", "--extra", "cpu", "anysub-worker"]

  ui-check:
    profiles: ["ui"]
    # The tag must equal the playwright version in apps/web/package.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace:z
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
    environment:
      UI_CHECK_BASE_URL: http://web:5173
      UI_CHECK_EMAIL: ${UI_CHECK_EMAIL:-admin@anysub.local}
      UI_CHECK_PASSWORD: ${UI_CHECK_PASSWORD:-anysub1234}
    command: ["node", "tests/ui-check/run.mjs"]

volumes:
  web-node-modules:
  web-app-node-modules:
  web-contracts-node-modules:
  worker-venv:
