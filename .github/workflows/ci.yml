name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
  workflow_call:
    inputs:
      skip-images:
        description: Skip the image builds when the caller builds them itself.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Includes the checks that src/generated matches the committed protocol
      # schema and that the database migrations match the Drizzle schema.
      - run: pnpm test

      - run: pnpm format:check

      - run: pnpm build

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/inference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.25 # Matches the uv FROM tag in workers/inference/Dockerfile.
          enable-cache: true
          cache-dependency-glob: workers/inference/uv.lock

      # uv installs the Python version from workers/inference/.python-version.
      # The speech and accelerator extras stay out of CI. Adapters import their
      # model libraries lazily, so the suite runs without PyTorch or WhisperX.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pyright

      # Includes the check that packages/contracts/schema matches the Pydantic models.
      - run: uv run pytest

  # Fails on known vulnerabilities in what the images ship. Web ignores live in
  # pnpm-workspace.yaml under auditConfig, worker ignores in the pip-audit step.
  # PyTorch comes from its own index, so pip-audit cannot check it.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Not --prod: the server bundles its libraries from devDependencies, so
      # those ship in the image too.
      - run: pnpm audit --audit-level high

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.25 # Matches the uv FROM tag in workers/inference/Dockerfile.

      # The transformers advisories cover loading untrusted models, training and
      # saving models. The worker only loads the models in its manifest and does
      # none of the rest. Their fixes need transformers 5, which WhisperX 3.8.6
      # blocks. Remove these ignores once WhisperX 3.8.7 is in.
      - name: pip-audit
        working-directory: workers/inference
        run: |
          ignored=(PYSEC-2025-217 PYSEC-2026-2288 PYSEC-2026-2289 PYSEC-2026-2290 PYSEC-2026-3929 PYSEC-2026-4174)
          for extra in cpu cuda; do
            uv export --locked --no-dev --no-hashes --no-emit-project \
              --extra speech --extra "$extra" --output-file "$RUNNER_TEMP/requirements-$extra.txt"
            uvx pip-audit==2.10.1 --no-deps --disable-pip "${ignored[@]/#/--ignore-vuln=}" \
              --requirement "$RUNNER_TEMP/requirements-$extra.txt"
          done

  # Proves every published image still builds, so a broken image is caught here
  # rather than during a release. No layer cache: the worker images are 3 GB and
  # more, and exporting them would exhaust the 10 GB repository cache budget.
  # Keep the matrix equal to the one in release.yml.
  images:
    name: Container image (${{ matrix.name }})
    if: ${{ !inputs.skip-images }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: worker
            dockerfile: workers/inference/Dockerfile
            build-args: ANYSUB_ACCELERATOR=cpu
          - name: worker-cuda
            dockerfile: workers/inference/Dockerfile
            build-args: ANYSUB_ACCELERATOR=cuda
          - name: worker-remote
            dockerfile: workers/inference/Dockerfile
            build-args: ANYSUB_LOCAL_MODELS=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The CUDA libraries alone outgrow the free space on a hosted runner.
      - name: Free disk space
        if: matrix.name != 'web'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          build-args: ${{ matrix.build-args }}
          push: false
