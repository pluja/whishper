name: anysub

# Nothing here needs configuring. Anysub generates its secrets on first start
# and keeps them in the database. See docs/CONFIGURATION.md for the optional
# settings a .env file next to this one can change.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATA_ROOT: /data
      ANYSUB_DATABASE_FILE: /database/anysub.db
      # Only an HTTPS reverse proxy needs this, to mark session cookies Secure.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      # adapter-node reads BODY_SIZE_LIMIT. The ANYSUB_ name is the documented one.
      BODY_SIZE_LIMIT: ${ANYSUB_BODY_SIZE_LIMIT:-64M}
      ANYSUB_MAX_UPLOAD_BYTES: ${ANYSUB_MAX_UPLOAD_BYTES:-536870912000}
      # adapter-node reads ADDRESS_HEADER. Empty means the socket address.
      ADDRESS_HEADER: ${ANYSUB_ADDRESS_HEADER:-}
    ports:
      - "${ANYSUB_PORT:-5173}:3000"
    volumes:
      # SQLite needs local disk: keep this volume off network shares.
      - database:/database
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: workers/inference/Dockerfile
      target: runtime
      args:
        # Selects the PyTorch wheels compiled into the image. The same value
        # becomes the worker's ANYSUB_DEVICE below, so the image and the runtime
        # device can never disagree.
        ANYSUB_ACCELERATOR: ${ANYSUB_ACCELERATOR:-cpu}
    restart: unless-stopped
    environment:
      ANYSUB_APP_URL: http://web:3000
      ANYSUB_WORKER_NAME: ${ANYSUB_WORKER_NAME:-local-worker}
      ANYSUB_DATA_ROOT: /data
      ANYSUB_MODEL_ROOT: /models
      ANYSUB_DEVICE: ${ANYSUB_ACCELERATOR:-cpu}
      ANYSUB_COMPUTE_TYPE: ${ANYSUB_COMPUTE_TYPE:-int8}
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      PYANNOTE_METRICS_ENABLED: "0"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      # The web service writes the worker token here, so the worker needs no
      # configuration to authenticate.
      - app-data:/data:ro
      - model-cache:/models

volumes:
  database:
  app-data:
  model-cache:
