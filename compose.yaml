name: anysub

# Nothing here needs configuring. Anysub generates its secrets on first start
# and keeps them in the database, and the first account sets models, defaults
# and upload limits under Administration. The few settings a .env file next to
# this one can change are in
# https://github.com/pluja/anysub/blob/main/docs/CONFIGURATION.md
#
# Both images carry the same version. Upgrading changes both tags together:
# https://github.com/pluja/anysub/blob/main/docs/UPGRADING.md

services:
  web:
    image: ghcr.io/pluja/anysub:4.2.0
    restart: unless-stopped
    environment:
      DATA_ROOT: /data
      ANYSUB_DATABASE_FILE: /database/anysub.db
      # Only an HTTPS reverse proxy needs this, to mark session cookies Secure.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      # adapter-node reads BODY_SIZE_LIMIT. The ANYSUB_ name is the documented one.
      BODY_SIZE_LIMIT: ${ANYSUB_BODY_SIZE_LIMIT:-64M}
      # adapter-node reads ADDRESS_HEADER. Empty means the socket address.
      ADDRESS_HEADER: ${ANYSUB_ADDRESS_HEADER:-}
    ports:
      - "${ANYSUB_PORT:-5173}:3000"
    volumes:
      # SQLite needs local disk: keep this volume off network shares.
      - database:/database
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    image: ghcr.io/pluja/anysub-worker:4.2.0
    restart: unless-stopped
    environment:
      ANYSUB_APP_URL: http://web:3000
      ANYSUB_WORKER_NAME: ${ANYSUB_WORKER_NAME:-local-worker}
      ANYSUB_DATA_ROOT: /data
      ANYSUB_MODEL_ROOT: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      PYANNOTE_METRICS_ENABLED: "0"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      # The web service writes the worker token here, so the worker needs no
      # configuration to authenticate.
      - app-data:/data:ro
      - model-cache:/models

volumes:
  database:
  app-data:
  model-cache:
