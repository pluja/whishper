packages:
  - apps/*
  - packages/*

# Pinning rule: exact versions for the authentication and upload libraries
# (better-auth, @tus/*, tus-js-client), where a minor release can change
# security or protocol behaviour. Caret ranges everywhere else. Dev tools that
# several packages share are declared once here and referenced as "catalog:".
catalog:
  prettier: ^3.6.2
  typescript: ^5.9.2
  vitest: ^3.2.4

# pnpm deploy, used by apps/web/Dockerfile to assemble the production tree,
# refuses workspace dependencies that are not injected before pnpm 12.2.
injectWorkspacePackages: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
